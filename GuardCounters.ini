; GuardCounters.ini - Guard Counters LE v0.4.2 (Data\SKSE\Plugins, ao lado da DLL).
; O menu do jogo (MCM "Guard Counters") le e escreve este ficheiro; pode tambem editar a mao e usar o botao
; de recarregar ou reiniciar o jogo. As chaves marcadas "nao usada" vem do mod original e ainda nao tem efeito.

[Counter]
; Nao usada: 0 = todos os bloqueios, 1 = so bloqueios cronometrados. O LE usa sempre o deflect do Inpa Sekiro.
TriggerMode=1
; Tempo para contra-atacar depois de um deflect (0.10-5.00 segundos).
WindowSeconds=2.5
; Pausa antes de outro counter poder ficar pronto (0.0-30.0 segundos, 0 = sem pausa).
CooldownSeconds=0.0

[Feedback]
; Mostra a marca perilous (kanji do Inpa Sekiro) no jogador enquanto o counter esta pronto (0 = nao, 1 = sim).
GlowEnabled=1
; Nao usadas: a marca e um modelo fixo, a cor nao se ajusta.
GlowColorR=0.05
GlowColorG=0.35
GlowColorB=1.0
GlowBrightness=100
GlowSaturation=100
; Sons do counter pronto e do golpe de counter (0 = desligado, 1 = ligado).
ReadySoundEnabled=1
SwingSoundEnabled=1
; Volume dos sons (0-200 por cento). Acima de 100 o som e sobreposto para ficar mais alto.
ReadySoundVolume=100
SwingSoundVolume=100

[Combat]
; Imunidade total ao dano durante o counter (SetGhost, como o Inpa Sekiro no parry).
Invulnerability=1
; 1 = a imunidade comeca no deflect e dura ate o golpe de counter acabar (nada o interrompe antes de comecar);
; 0 = so enquanto o golpe de counter decorre.
ImmunityFromDeflect=1
; Imunidade a stagger no jogador enquanto um counter esta pronto ou a decorrer (re-aplicada quando leva um golpe).
SuperArmor=1
; Stagger forcado em cada inimigo atingido pelo golpe de counter (anula a imunidade a stagger dele).
ForcedStagger=1
; Tambem staggerar o inimigo do deflect, mesmo que o golpe de counter nao o atinja (0 = nao, 1 = sim).
StaggerDeflectedEnemy=1
; Stagger pesado no inimigo do deflect JA NO DEFLECT, sem esperar pelo ataque: corta o golpe seguinte dele (0 = nao,
; 1 = sim). Se o evento for recusado (o inimigo ainda esta a reagir ao deflect), volta a tentar a cada 100 ms.
StaggerOnDeflect=0
; Quanto depois do golpe de counter comecar o inimigo do deflect leva o stagger (0-1500 ms; 0 = logo no inicio).
StaggerDelayMs=0
; Enquanto o golpe de counter dura, volta a staggerar o inimigo de X em X ms para ele nao recuperar, bloquear nem
; atacar antes de o counter acabar (0-3000; 0 = so uma vez). Aplica-se ao inimigo do deflect, aos atingidos e aos
; que atacam o jogador durante o golpe.
StaggerRepeatMs=800
; Forca do stagger: 0.20 pequeno, 0.50 medio, 0.75 grande, 1.00 maximo.
StaggerMagnitude=1.0
; Dano do counter (0-300 por cento, 100 = normal). Acima de 100 soma dano extra ao inimigo (parte do dano base da
; arma); abaixo de 100 devolve parte do dano (aproximado).
CounterDamagePercent=100
; Gasta estamina quando o golpe de counter comeca (0 = nao, 1 = sim).
StaminaCostEnabled=1
; Custo fixo de estamina (0-500). A estamina nao desce de 0.
StaminaCost=20
; Abrandar o tempo (efeito do grito Slow Time do Skyrim) durante o golpe de counter. Opcional, desligado por omissao.
SlowTime=0
; Quanto tempo o tempo fica abrandado depois do golpe de counter comecar (0.3-3.0 s).
SlowTimeSeconds=1.0
; Nao usada.
EffectTimeoutSeconds=4.0

[LE]
; Variavel de animacao que o Inpa Sekiro poe a TRUE quando um deflect resulta (e volta a false 1.5-4.2 s depois).
; So mude se o log mostrar que o deflect do Inpa usa outra.
DeflectVariable=bNoStagger
; 1 = so conta como deflect se o jogador estava a bloquear ("isBlocking") ha pouco; evita falsos positivos.
RequireBlocking=1
; Quanto tempo atras (segundos) o jogador pode ter estado a bloquear para o deflect contar.
BlockGraceSeconds=1.5
; 1 = so arma o counter com a arma desembainhada.
RequireWeaponDrawn=1
; Maximo de segundos que os efeitos do golpe de counter ficam ligados (fecham mais cedo se o golpe acabar).
ArmedHoldSeconds=3.0
; Minimo de segundos que os efeitos do golpe de counter ficam ligados depois de atacar, mesmo que o jogo diga que o
; golpe ja acabou (o estado de ataque pode cair a 0 cedo). 0.2-3.0
MinSwingSeconds=1.2
; 1 = o log regista cada mudanca (deixe a 1 enquanto testa e envie o log se algo falhar).
Verbose=1
; Sinal para o Themis (OAR/DAR do LE): o atributo do jogador que a DLL poe a 1 durante a janela de counter.
; 77 = Variable10. Se mudar, regenere as pastas DAR com tools\make_dar.py --av <numero>.
SignalEnabled=1
SignalActorValue=77
; Idioma do menu: 0 = English, 1 = Portugues.
Language=1
