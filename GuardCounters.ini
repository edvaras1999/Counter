; GuardCounters.ini - Guard Counters LE v0.1 (Data\SKSE\Plugins, ao lado da DLL).
; Nesta versao so estas chaves tem efeito: [Counter] WindowSeconds, CooldownSeconds;
; [Combat] StaminaCostEnabled, StaminaCost; e tudo o que esta em [LE].
; As restantes (TriggerMode, [Feedback], Invulnerability, SuperArmor, ForcedStagger, StaggerMagnitude,
; CounterDamagePercent, EffectTimeoutSeconds) sao do mod original e ficam aqui para as versoes seguintes.

[Counter]
; 0 = All successful blocks, 1 = Timed/perfect blocks only.
TriggerMode=1
; Time allowed to input a counter after an accepted block (0.10-5.00 seconds).
WindowSeconds=1.5
; Delay before another counter can become ready (0.0-30.0 seconds, 0 = disabled).
CooldownSeconds=0.0

[Feedback]
; Show the character glow while a counter is ready (0 = off, 1 = on).
GlowEnabled=1
; Glow RGB channels (0.0-1.0 each).
GlowColorR=0.05
GlowColorG=0.35
GlowColorB=1.0
; Glow brightness and color saturation (0-200 percent).
GlowBrightness=100
GlowSaturation=100
; Enable the counter-ready and counter-attack sounds (0 = off, 1 = on).
ReadySoundEnabled=1
SwingSoundEnabled=1
; Sound volume (0-200 percent). Values above 100 use layered playback.
ReadySoundVolume=100
SwingSoundVolume=100

[Combat]
; Prevent damage during the counter animation (0 = off, 1 = on).
Invulnerability=1
; Prevent incoming hits from staggering the player during the counter (0 = off, 1 = on).
SuperArmor=1
; Force the first valid counter hit to stagger its target (0 = off, 1 = on).
ForcedStagger=1
; Forced stagger strength: 0.20 = Small, 0.50 = Medium, 0.75 = Large, 1.00 = Maximum.
StaggerMagnitude=1.0
; Counter-hit damage (0-300 percent, 100 = normal damage).
CounterDamagePercent=100
; Consume stamina when the counter animation starts (0 = off, 1 = on).
StaminaCostEnabled=1
; Flat stamina cost (0-500). Current stamina will not fall below 0.
StaminaCost=20
; Fallback duration for counter combat effects when no recovery event occurs (0.25-10.0 seconds).
EffectTimeoutSeconds=4.0

[LE]
; Variavel de animacao que o Inpa Sekiro poe a TRUE quando um deflect resulta (e volta a false 1.5-4.2 s depois).
; So mude se o log mostrar que o deflect do Inpa usa outra.
DeflectVariable=bNoStagger
; 1 = so conta como deflect se o jogador estava a bloquear ("isBlocking") ha pouco; evita falsos positivos
; de outros mods que tambem usam bNoStagger.
RequireBlocking=1
; Quanto tempo atras (segundos) o jogador pode ter estado a bloquear para o deflect contar.
BlockGraceSeconds=1.0
; 1 = so arma o counter com a arma desembainhada.
RequireWeaponDrawn=1
; Maximo de segundos que a variavel GuardCounters_Trigger fica a 1 depois de carregar em atacar
; (fecha mais cedo se o golpe acabar).
ArmedHoldSeconds=1.5
; 1 = o log regista cada mudanca (versao de teste: deixe a 1 e envie o log se algo falhar).
Verbose=1
